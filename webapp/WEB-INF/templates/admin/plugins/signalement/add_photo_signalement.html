<link rel="stylesheet" href="css/plugins/signalement/signalement.css" type="text/css"/>
<div class="row">
	<div class="col-12 col-sm-12 col-md-12 col-lg-12">
		<div class="card">
			<div class="card-header">
				<h3 class="card-title">#i18n{dansmarue.page.signalement.addPhotoSignalement.title}</h3>
			</div>
			<div class="card-body">
				<div class="bg-danger">${error!}</div>
				<form class="form-horizontal" method="post" enctype="multipart/form-data" action="jsp/admin/plugins/signalement/DoSavePhotoToSignalement.jsp">
					<input type="hidden" id="jsp_back" name="jsp_back" value="${jsp_back!}" />
					<@formGroup labelKey='#i18n{dansmarue.saveSignalement.photo} * :' labelFor='photo'>
						<input type="file" id="photo" name="photo" />
					</@formGroup>
					<@formGroup labelKey='&nbsp;'>
						<!-- VuePhoto 1 for ensemble, 0 for près -->
						<label class="radio-inline"><input class="radio" type="radio" name="vuePhoto" id="vuePhoto" value="1" checked /> #i18n{dansmarue.saveSignalement.vueEnsemble}</label>
						<label class="radio-inline"><input class="radio" type="radio" name="vuePhoto" id="vuePhoto" value="0" /> #i18n{dansmarue.saveSignalement.vuePres}</label>
					</@formGroup>
					<input type="hidden" value="${signalement_id!}" name="signalement_id" />
					<@formGroup rows=2 class="text-center">
						<button class="btn btn-primary btn-sm" type="submit" name="saveAddPhoto"><i class="bi bi-check"></i> #i18n{dansmarue.addPhotoSignalement.save}</button>
						<button class="btn btn-sm" type="submit" name="cancelAddPhoto" value="0"><i class="bi bi-x-circle"></i> #i18n{dansmarue.addPhotoSignalement.cancel}</button>
					</@formGroup>
				</form>
			</div>
		</div>
	</div>
</div>
