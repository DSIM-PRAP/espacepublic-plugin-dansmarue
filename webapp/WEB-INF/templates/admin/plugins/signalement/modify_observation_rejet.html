<#include "macro/form_style_horizontal.html" />
<div class="row">
	<div class="col-12 col-sm-12 col-md-12 col-lg-12">
		<div class="card">
			<div class="card-header">
				<h3 class="card-title">#i18n{dansmarue.observationRejet.update.name}</h3>
			</div>

			<div class="card-body">
				${error!}
				<form class="form-horizontal" method="post"
					action="jsp/admin/plugins/signalement/DoModifyObservationRejet.jsp?observation_rejet_id=${observation_rejet.id}">
					<input type="hidden" id="jsp_back" name="jsp_back"
						value="${jsp_back!}" /> <input type="hidden" name="id"
						value="${observation_rejet.id!}" />
					<div class="col-12 col-sm-12 col-md-12">
						<div class="form-group">
							<label class="<@labelStyle />" for="libelle">#i18n{dansmarue.commons.libelle}
								* : </label>
							<div class="<@inputStyle />">
								<textarea class="form-control form-control-sm" id="libelle"
									name="libelle">${observation_rejet.libelle!}</textarea>
							</div>
						</div>
						<div class="form-group">
							<label class="<@labelStyle />" for="actif">#i18n{dansmarue.commons.actif}
								* :</label>
							<div class="<@inputStyle />">
								<INPUT class="checkbox" TYPE=CHECKBOX NAME="actif"<#if
								observation_rejet.actif>checked="checked"</#if>>
							</div>
						</div>
						<div class="form-group">
							<div
								class="col-12 offset-sm-3 col-sm-6 offset-md-3 col-md-6">
								<button type="submit" value="#i18n{dansmarue.commons.save}"
									name="#i18n{dansmarue.commons.save}"
									class="btn btn-primary btn-sm" tabindex="3">
									<i class="bi bi-check"></i>
									#i18n{dansmarue.commons.save}
								</button>
								<button type="submit" value="#i18n{dansmarue.commons.cancel}"
									name="cancel" class="btn btn-default btn-sm">
									<i class="bi bi-x-circle"></i>
									#i18n{dansmarue.commons.cancel}
								</button>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
